modLoader = "javafml"
loaderVersion = "${loader_version_range}"
issueTrackerURL = "https://github.com/yisylvie/create-toolbox-tooltip/issues"
displayURL = "https://modrinth.com/mod/create-toolbox-tooltip/"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${version}"
