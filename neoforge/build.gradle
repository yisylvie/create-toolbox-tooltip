plugins {
	id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neo_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')

    // dependencies

    // Mixin Extras needs to be added manually bc Forge does not come with it bundled
//	compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.4.1"))
//	implementation(include("io.github.llamalad7:mixinextras-forge:0.4.1"))

    // Shulker Box Tooltip
    modImplementation("com.misterpemodder:shulkerboxtooltip-neoforge:$shulkerboxtooltip_version") { transitive false }

    // Create and its dependencies
    implementation("com.simibubi.create:create-${minecraft_version}:${create_neo_version}:slim") { transitive = false }
	implementation("net.createmod.ponder:ponder-neoforge:${ponder_neo_version}+mc${minecraft_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_neo_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_neo_version}")
    implementation("com.tterrag.registrate:Registrate:${registrate_neo_version}")

    // Development QOL
    modLocalRuntime("mezz.jei:jei-$minecraft_version-neoforge:$jei_version") { transitive = false }
}

processResources {
    // set up properties for filling into metadata
    Map<String, Object> properties = [
            "version": version,
            "neo_version": neo_version.split("\\.")[0], // only specify major version of neoforge
            "minecraft_version": minecraft_version,
            "flywheel_version": flywheel_neo_version,
            "shulkerboxtooltip_version": shulkerboxtooltip_version,
            "create_version": create_neo_version.split("-")[0] // cut off build number
    ]
    inputs.properties(properties)

    filesMatching("META-INF/neoforge.mods.toml") {
        expand properties
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
