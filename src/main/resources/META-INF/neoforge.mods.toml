authors = "Sylvie Lee"
description = "What's in my toolbox?"
logoFile = "../icon.png"
displayURL = "https://modrinth.com/mod/create-toolbox-tooltip"

[[dependencies."${mod_id}"]]
modId = "neoforge"
mandatory = true
versionRange="[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "create"
mandatory = true
versionRange = "[0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "shulkerboxtooltip"
mandatory = true
versionRange = "${shulkerboxtooltip_version}"
ordering = "NONE"
side = "BOTH"

[[mixins]]
config="${mod_id}.mixins.json"
